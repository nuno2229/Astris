# Tests on every push/PR. Build and publish a release-tagged image to GHCR when a tag like v0.2.0 is pushed (§20, E19-02).
name: release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Create roles and test DB
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -v owner_pw=ft_owner_dev -v app_pw=ft_app_dev \
               -v dbname=finance_tracker_test -f scripts/bootstrap_db.sql
      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Backend tests
        working-directory: backend
        run: pip install -e ".[dev]" && pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
  smoke:
    # start the real image the way Unraid does (empty AppData, user 99:100) and check the app answers, before publishing
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: astris:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: All-in-one start as Unraid would
        run: |
          mkdir -p /tmp/appdata && sudo chown 0:0 /tmp/appdata
          docker run -d --name astris -p 8484:8000 -v /tmp/appdata:/data -e PUID=99 -e PGID=100 -e ADMIN_EMAIL=me@example.com astris:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8484/api/health; then echo; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' astris)" != "true" ]; then break; fi
            sleep 3
          done
          docker logs astris
          curl -fsS http://127.0.0.1:8484/api/health | grep '"db":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8484/
          curl -fsS -H 'Content-Type: application/json' -d '{"email":"me@example.com","display_name":"Me","password":"correct horse battery"}' \
               http://127.0.0.1:8484/api/auth/register | grep -q '"is_server_admin":true'
      - name: Restart keeps data and stops cleanly
        run: |
          docker restart -t 60 astris
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8484/api/health && break; sleep 3; done
          docker logs astris 2>&1 | tail -20
          curl -fsS -H 'Content-Type: application/json' -d '{"email":"me@example.com","password":"correct horse battery"}' \
               http://127.0.0.1:8484/api/auth/login | grep -q me@example.com
          sudo ls -ln /tmp/appdata
  image:
    needs: [test, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/astris
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
