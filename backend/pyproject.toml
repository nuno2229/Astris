[project]
name = "finance-tracker"
version = "0.1.1"  # bump together with the git tag (vX.Y.Z)
description = "Private, self-hosted household money + shopping hub"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "ofxparse>=0.21",
  "email-validator>=2",
  "mt-940>=4.30",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.10",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
