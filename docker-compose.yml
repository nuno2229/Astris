# Astris, all-in-one: the app runs its own database inside ./data (or DATA_DIR). Copy .env.docker.example to .env first.
# Prefer your own PostgreSQL? Set DB_HOST, DB_ADMIN_URL, DB_APP_PASSWORD and DB_OWNER_PASSWORD in .env (README).
services:
  astris:
    image: ${IMAGE:-ghcr.io/nuno2229/astris}:${TAG:-latest}
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${PORT:-8484}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      ASTRIS_KEY: ${ASTRIS_KEY:-}
      ASTRIS_OLD_KEYS: ${ASTRIS_OLD_KEYS:-}
      HTTPS: ${HTTPS:-off}
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}
      TZ: ${TZ:-Europe/London}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DB_HOST: ${DB_HOST:-}
      DB_ADMIN_URL: ${DB_ADMIN_URL:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-}
