# Generic / Unraid "Docker Compose Manager" setup: Postgres + Astris.
# Copy .env.docker.example to .env and set real passwords first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  app:
    image: ${IMAGE:-ghcr.io/nuno2229/astris}:${TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${PORT:-8484}:8000"
    volumes:
      - ${DATA_DIR:-./data}/backups:/data/backups
    environment:
      DB_HOST: db
      DB_NAME: finance_tracker
      DB_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TZ: ${TZ:-Europe/London}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}      # set to encrypt backups; keep it safe, it can't be recovered
